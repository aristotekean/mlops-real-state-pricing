# Grafana dashboard provisioning · loads every JSON under /var/lib/grafana/dashboards.

apiVersion: 1

providers:
  - name: real-estate-mlops
    orgId: 1
    folder: Real Estate MLOps
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
