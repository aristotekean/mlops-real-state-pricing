# Mirror of the `grafana` service in infra/monitoring/docker-compose.yml. The
# datasource, the dashboard provider and the dashboard are the same files the
# compose service mounts (provisioning/ and dashboards/ next to this file),
# delivered here as ConfigMaps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      # The image runs as uid 472; fsGroup makes the emptyDir writable for it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          envFrom:
            # GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD, rendered
            # from .env by infra/k8s/scripts/render-env.sh.
            - secretRef:
                name: grafana-credentials
          env:
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Land on the provisioned dashboard straight away.
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/real-estate-api.json
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # /api/health answers once the database is migrated and the
          # provisioning has run.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        # Both ConfigMaps are generated in kustomization.yaml with a content
        # hash in their name, so editing a provisioning file or the dashboard
        # rolls the pod. `items` rebuilds the directory layout Grafana expects.
        - name: provisioning
          configMap:
            name: grafana-provisioning
            items:
              - key: datasource.yml
                path: datasources/datasource.yml
              - key: dashboards.yml
                path: dashboards/dashboards.yml
        - name: dashboards
          configMap:
            name: grafana-dashboards
        # Nothing worth keeping lives here: the datasource and the dashboard
        # are provisioned on every start, and users, sessions and changes made
        # in the UI are disposable. A restart resets them to what is in git.
        - name: data
          emptyDir:
            sizeLimit: 256Mi
