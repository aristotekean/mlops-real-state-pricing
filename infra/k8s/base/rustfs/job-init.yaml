# One-shot: create the MLflow artifact bucket. Reuses the RustFS image because
# it ships `rc`. There is no `depends_on` in Kubernetes, so the script retries
# `rc alias set` (which probes the server) until RustFS answers, then creates
# the bucket idempotently. Re-running the Job on an existing bucket is a no-op.
#
# A Job's pod template is immutable once created. Finished Jobs are
# garbage-collected after ttlSecondsAfterFinished, so a later
# `kubectl apply -k infra/k8s` recreates (and re-runs) the Job instead of
# failing with "field is immutable"; within that window, delete it by hand.
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-init
  labels:
    app.kubernetes.io/name: rustfs-init
spec:
  # Bounded on both axes: at most 6 retries of the pod, and the whole Job is
  # killed and marked Failed after 10 minutes regardless of retries. The
  # deadline also covers scheduling, the image pull and the wait below.
  backoffLimit: 6
  activeDeadlineSeconds: 600
  # Keep the finished Job (and its logs) for 10 minutes, then let the TTL
  # controller delete it so the next apply can recreate it.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: rc
          image: rustfs/rustfs:1.0.6
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # Bounded wait: 40 x 3 s = 2 minutes. rc's own errors stay on
              # stderr so the reason for waiting is visible in the Job logs.
              attempt=0
              until rc alias set local http://rustfs:9000 "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY" >/dev/null; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 40 ]; then
                  echo "rustfs not reachable at http://rustfs:9000 after $attempt attempts, giving up" >&2
                  exit 1
                fi
                echo "waiting for rustfs ($attempt/40)..."
                sleep 3
              done
              rc bucket create --ignore-existing "local/$MLFLOW_ARTIFACTS_BUCKET"
              echo "bucket ready: $MLFLOW_ARTIFACTS_BUCKET"
          envFrom:
            - secretRef:
                name: rustfs-credentials
            # MLFLOW_ARTIFACTS_BUCKET, from .env.
            - configMapRef:
                name: mlflow-server-env
          # rc only: small, bounded.
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
