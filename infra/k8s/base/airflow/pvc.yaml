# Task logs of every DAG run. The scheduler's task subprocesses (LocalExecutor)
# write them and the api-server serves them, so both containers of the pod
# mount this volume. On a PVC they survive pod restarts and rollouts, which
# keeps the execution history auditable (an emptyDir lost them).
#
# ReadWriteOnce is enough: one Airflow pod (Recreate strategy). Airflow does
# not prune logs; 2Gi holds thousands of runs of this DAG.
# No storageClassName: the cluster default is used (OrbStack: local-path).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-logs
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
