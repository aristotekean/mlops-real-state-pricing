# Same image and flags as the `prometheus` service in
# infra/monitoring/docker-compose.yml, except for the scrape configuration:
# here the API pods are discovered through the Kubernetes API (prometheus.yml).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  # A single instance owns the TSDB volume: the StatefulSet keeps its PVC
  # across restarts and terminates the old pod before creating the new one, so
  # two instances never write the same volume.
  serviceName: prometheus-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: prometheus
      # The image runs as `nobody`; fsGroup makes the volume writable for it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            # Below the 5Gi volume, so the TSDB drops old blocks before the
            # disk fills up.
            - --storage.tsdb.retention.size=4GB
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          # A handful of targets at a 15 s interval: small head block. Raise
          # the memory limit if more jobs are added and the pod is OOMKilled.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Replaying the write-ahead log after a restart can take a while.
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        # Generated in kustomization.yaml with a content hash in its name: a
        # change to prometheus.yml rolls the pod, so no reload endpoint is
        # needed.
        - name: config
          configMap:
            name: prometheus-config
  volumeClaimTemplates:
    - metadata:
        name: data
        # Declared here instead of left to the root kustomization: kubectl's
        # kustomize (5.6) adds the shared label to volumeClaimTemplates and
        # the one bundled with Argo CD (5.8) does not. The field is
        # immutable, so both renders must produce the same template.
        labels:
          app.kubernetes.io/part-of: real-estate
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
