# Gateway API entry point: the only way into the `real-estate` namespace from
# outside the cluster. It needs the Gateway API CRDs and a controller serving
# the `traefik` GatewayClass; install both first (infra/k8s/traefik, see
# README).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - gateway.yaml
  - httproutes.yaml
