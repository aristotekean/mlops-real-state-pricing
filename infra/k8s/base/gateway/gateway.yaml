# The single entry point into the `real-estate` namespace from outside the
# cluster: one HTTP listener that the HTTPRoutes in httproutes.yaml attach to.
#
# `gatewayClassName: traefik` binds it to the Traefik controller installed from
# infra/k8s/traefik. Swapping the implementation (Envoy Gateway, NGINX Gateway
# Fabric, ...) means changing that class and the listener port, not the routes.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: real-estate
  labels:
    app.kubernetes.io/name: gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      # Traefik requires the listener port to equal the port of one of its
      # entryPoints, which is the container port (8000, unprivileged), not the
      # port clients use: the `traefik` LoadBalancer Service maps 80 -> 8000.
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same
