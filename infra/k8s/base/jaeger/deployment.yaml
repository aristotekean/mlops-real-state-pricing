# Mirror of the `jaeger` service in infra/monitoring/docker-compose.yml:
# Jaeger v2 all-in-one, traces kept in memory and lost when the pod restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  # The traces live in the memory of the one pod: a second replica would
  # receive part of the spans and show part of the traces.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      # Same uid the image declares.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.23.0
          args:
            # The built-in configuration keeps up to 100000 traces; a load
            # test at full sampling fills that in minutes. Capped so the
            # oldest traces are dropped before the memory limit is reached.
            - --set=extensions.jaeger_storage.backends.some_storage.memory.max_traces=20000
          env:
            # Makes the Go runtime collect before the container limit, instead
            # of growing into an OOMKill.
            - name: GOMEMLIMIT
              value: 400MiB
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
            - name: health
              containerPort: 13133
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /status
              port: health
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /status
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
