# Public side of the proxy: clients reach port 80, Traefik listens on 8000.
# On OrbStack this LoadBalancer is what `*.k8s.orb.local` resolves to.
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
