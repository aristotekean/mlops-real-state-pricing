# Traefik proxy with only the Gateway API provider enabled: it ignores Ingress
# objects and its own CRDs, so the Gateway and HTTPRoutes of
# infra/k8s/base/gateway are its whole configuration.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
    spec:
      serviceAccountName: traefik
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: traefik
          image: traefik:v3.7.15
          args:
            - --providers.kubernetesgateway=true
            # Copies the LoadBalancer address of the Service into the status
            # of every Gateway, so `kubectl get gateway` shows where it listens.
            - --providers.kubernetesgateway.statusaddress.service.namespace=traefik
            - --providers.kubernetesgateway.statusaddress.service.name=traefik
            # Unprivileged port; Gateway listeners must use this same number.
            - --entrypoints.web.address=:8000
            # Time allowed to read a whole request, body included. MLflow
            # clients upload model artifacts through the tracking server, and
            # the 60 s default would cut a slow or large upload.
            - --entrypoints.web.transport.respondingtimeouts.readtimeout=3600s
            # /ping on the internal `traefik` entryPoint (:8080), for probes.
            - --ping=true
          ports:
            - name: web
              containerPort: 8000
            - name: traefik
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ping
              port: traefik
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: traefik
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
