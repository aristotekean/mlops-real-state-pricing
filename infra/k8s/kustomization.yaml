# Kustomize root for Server A of the real estate MLOps stack on Kubernetes
# (OrbStack locally; any cluster with a default StorageClass otherwise).
#
# Everything under this directory is in git, so Argo CD can render it
# (infra/argocd/application.yaml). The Secrets are the exception: they are
# rendered from .env into generated/ (git-ignored) and applied by hand, once
# and after every credential change:
#   kubectl create namespace real-estate    # first time only
#   bash infra/k8s/scripts/render-env.sh    # .env -> settings/ and generated/
#   kubectl apply -k infra/k8s/generated    # the Secrets
#
# Without Argo CD, deploy the rest by hand:
#   kubectl apply -k infra/k8s              # deploy / update everything
#   kubectl kustomize infra/k8s             # render the manifests only
#   kubectl -n real-estate get pods         # watch the rollout
#
# Everything lands in the `real-estate` namespace. Third-party images follow
# docker-compose.yml: postgres and mlflow are pinned in their own manifests,
# and so is RustFS (`rustfs/rustfs`).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: real-estate

# Shared label on every object (metadata and pod templates, not selectors, so
# adding or renaming it never breaks an existing Deployment/Service pairing).
labels:
  - pairs:
      app.kubernetes.io/part-of: real-estate
    includeSelectors: false
    includeTemplates: true

resources:
  - base/config
  - base/postgres-mlflow
  - base/rustfs
  - base/mlflow
  - base/postgres-train
  - base/api-inference
  - base/frontend
  - base/postgres-airflow
  - base/airflow
  - base/ingress

# Non-secret ConfigMaps rendered from .env by scripts/render-env.sh and
# committed, so a configuration change reaches the cluster through git.
components:
  - settings

images:
  # Project images, named without a tag in the manifests. The update-manifests
  # job of .github/workflows/ci-cd-unit-tests-dockerhub.yml rewrites newName
  # and newTag below with the commit SHA after every publish; Argo CD deploys
  # that commit. The values here are placeholders until the first run.
  - name: aristotekean/real-estate-api-inference
    newName: docker.io/aristotekean/real-estate-api-inference
    newTag: latest
  - name: aristotekean/real-estate-frontend
    newName: docker.io/aristotekean/real-estate-frontend
    newTag: latest
  - name: aristotekean/real-estate-airflow
    newName: docker.io/aristotekean/real-estate-airflow
    newTag: latest
