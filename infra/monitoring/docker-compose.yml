# Real Estate MLOps · observability stack (Server C)
#
#   S8 Prometheus  --->  scrapes api-inference:8000/metrics
#   S9 Grafana     --->  queries Prometheus, serves the dashboard
#   S10 Jaeger     <---  receives the traces api-inference and the frontend
#                        export over OTLP/HTTP, serves the trace UI
#
# Included by the root docker-compose.yml under the `monitoring` profile, so a
# plain `docker compose up` never starts it. Paths are relative to this file.
#
# Local, with the full stack (from the repository root):
#   docker compose --profile monitoring up -d --build
# Monitoring only (naming a service enables its profile):
#   docker compose up -d prometheus grafana jaeger
#   Prometheus UI on http://localhost:9090
#   Grafana     UI on http://localhost:3000   (GRAFANA_ADMIN_USER / _PASSWORD)
#   The "Real Estate · Inference API" dashboard is provisioned automatically.
#   Jaeger      UI on http://localhost:16686  (JAEGER_UI_PORT)
#
# On a dedicated Server C (the API stack lives on Server A): run this file on
# its own and point Prometheus at Server A by editing the scrape target in
# prometheus/prometheus.yml (see infra/monitoring/README.md). The profile is
# required here too, otherwise compose starts nothing; the settings file is
# passed explicitly because the project directory is then this folder:
#   docker compose --env-file ../../.env -f docker-compose.yml --profile monitoring up -d
#
# Settings come from .env at the repository root (PROMETHEUS_PORT,
# PROMETHEUS_RETENTION, GRAFANA_PORT, GRAFANA_ADMIN_USER,
# GRAFANA_ADMIN_PASSWORD, JAEGER_UI_PORT, JAEGER_OTLP_PORT; see .env.example).

services:
  # ------------------------------------------------------------------------- #
  # S8 · Prometheus (metrics collection)
  # ------------------------------------------------------------------------- #
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [ "monitoring" ]
    container_name: real-estate-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:?}
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:?}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # S9 · Grafana (dashboards)
  #
  # Datasource and dashboard are provisioned from infra/monitoring/grafana, so
  # the "Real Estate · Inference API" dashboard is present on first start with no
  # manual setup.
  # ------------------------------------------------------------------------- #
  grafana:
    image: grafana/grafana:11.4.0
    profiles: [ "monitoring" ]
    container_name: real-estate-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Land on the provisioned dashboard straight away.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/real-estate-api.json
    ports:
      - "${GRAFANA_PORT:?}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ------------------------------------------------------------------------- #
  # S10 · Jaeger (distributed traces of the inference requests)
  #
  # Jaeger v2 all-in-one: OTLP/HTTP receiver on 4318, UI and query API on
  # 16686. Traces are kept in memory and are lost when the container restarts.
  # Inside the compose network the services reach it as http://jaeger:4318;
  # the published OTLP port is for exporters outside it (the cluster, another
  # server).
  # ------------------------------------------------------------------------- #
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: [ "monitoring" ]
    container_name: real-estate-jaeger
    ports:
      - "${JAEGER_UI_PORT:?}:16686"
      - "${JAEGER_OTLP_PORT:?}:4318"
    restart: unless-stopped

volumes:
  prometheus-data:
    name: real_estate_prometheus
  grafana-data:
    name: real_estate_grafana
