# Scrape target for the Inference API (file_sd for job `real-estate-api`) in
# the compose deployment. On Kubernetes this file is not used: the Prometheus
# of infra/k8s/base/prometheus discovers the API pods through the cluster API.
#
# Local compose network (root docker-compose.yml, default): the Docker service
# name.
#   - targets: ["api-inference:8000"]
#
# API on another machine: the host:port where it is reachable, e.g.
#   - targets: ["server-a:8000"]
#   - targets: ["10.0.0.5:8000"]
#
# Prometheus reloads this file automatically; no restart needed after editing.

- targets: ["api-inference:8000"]
  labels:
    service: api-inference
