# Prometheus scrape configuration · Server C (observability)
#
# Scrapes the Inference API's /metrics endpoint. The target lives in
# prometheus/targets/api-targets.yml: by default the Kubernetes Service (OrbStack
# resolves it from containers); in the local compose stack use `api-inference:8000`;
# on a dedicated Server C, Server A's address/port (see infra/monitoring/README.md).
#
# The S3 artifact store is RustFS, which exposes no Prometheus metrics endpoint,
# so there is no artifact-store scrape job (unlike a MinIO-based setup).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: real-estate-mlops

scrape_configs:
  # The service under observation. The target lives in a separate file
  # (prometheus/targets/api-targets.yml) so it can be changed per deployment
  # without editing this config: the cluster Service on OrbStack (default),
  # `api-inference:8000` on the local compose network, or Server A's address
  # (host:port) from a dedicated Server C.
  # file_sd reloads the target automatically.
  - job_name: real-estate-api
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus/targets/api-targets.yml"]

  # Prometheus scraping itself (useful to confirm the stack is alive).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
